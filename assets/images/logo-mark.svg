<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="SafeRide Schools logo mark">
  <defs>
    <linearGradient id="sr-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B262B"/>
      <stop offset="0.55" stop-color="#123C43"/>
      <stop offset="1" stop-color="#14806b"/>
    </linearGradient>
  </defs>
  <rect width="96" height="96" rx="22" fill="url(#sr-bg)"/>
  <rect x="1.5" y="1.5" width="93" height="93" rx="20.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="2"/>
  <g transform="translate(24,22)">
    <!-- Safety shield -->
    <path d="M24 3.5 40.2 9.7v13.9c0 9.3-6.7 15.9-16.2 20.4C14.5 39.5 7.8 32.9 7.8 23.6V9.7L24 3.5Z" fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-linejoin="round"/>
    <!-- School bus, front view -->
    <rect x="15" y="16.5" width="18" height="13" rx="3.2" fill="#FFFFFF"/>
    <!-- Windshield, split -->
    <rect x="17.6" y="19" width="12.8" height="5.4" rx="1.4" fill="#0B262B"/>
    <rect x="23.3" y="19" width="1.4" height="5.4" fill="#FFFFFF"/>
    <!-- Gold beltline: school-bus amber cue -->
    <rect x="15" y="25.7" width="18" height="2.1" fill="#D6B36A"/>
    <!-- Headlights -->
    <circle cx="19.3" cy="28.1" r="1.2" fill="#0B262B"/>
    <circle cx="28.7" cy="28.1" r="1.2" fill="#0B262B"/>
    <!-- Wheels -->
    <path d="M19.6 29.5v2.8M28.4 29.5v2.8" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>
  </g>
</svg>
